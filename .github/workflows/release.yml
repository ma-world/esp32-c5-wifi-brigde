name: Firmware release

on:
  push:
    tags:
      - '*Release*'

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ESP-IDF prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Install ESP-IDF 5.5.3 for ESP32-C5
        run: |
          git clone --depth 1 --branch v5.5.3 --recurse-submodules --shallow-submodules https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/esp-idf"
          (cd "$RUNNER_TEMP/esp-idf" && ./install.sh esp32c5)

      - name: Build firmware
        shell: bash
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          idf.py set-target esp32c5
          idf.py build

      - name: Package factory and application images
        shell: bash
        run: |
          source "$RUNNER_TEMP/esp-idf/export.sh"
          mkdir -p release
          cp build/sta_to_eth.bin release/esp32-c5-wifi-brigde-app.bin
          python -m esptool --chip esp32c5 merge_bin \
            --format raw --target-offset 0x0 \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            --output release/esp32-c5-wifi-brigde-factory.bin \
            0x2000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/sta_to_eth.bin \
            0x210000 build/ota_data_initial.bin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.bin --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.bin \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
